  <title>CampusVenta | Marketplace UTP</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('campusventa_theme') || localStorage.getItem('campusventa_tema') || 'claro';
        var d = t === 'oscuro' || (t === 'sistema' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#050507');
        }
      } catch (e) { }
    })();
  </script>
